name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add conda to system path
      run: |
        # $CONDA is the root of the preinstalled miniconda
        echo $CONDA/bin >> $GITHUB_PATH

    - name: Fix conda permissions
      run: sudo chown -R $(id -u):$(id -g) $CONDA

    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base

    - name: Lint with flake8
      run: |
        conda install --yes flake8
        # stop the build on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # treat everything else as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        conda install --yes pytest
        pytest
